js_import accept from /etc/nginx/nginx-accept.js;
js_set $representation accept.representation;

map $representation $home_file {
    markdown /index.md;
    default  /index.html;
}

map $representation $error_path {
    markdown /_errors/markdown;
    default  /_errors/html;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    charset utf-8;
    charset_types text/xml text/plain text/vnd.wap.wml application/javascript application/rss+xml application/json text/markdown;

    gzip on;
    gzip_types text/css application/javascript application/xml text/xml text/markdown image/svg+xml;
    error_page 404 $error_path;

    location = / {
        add_header Vary Accept always;
        add_header Link '</index.md>; rel="alternate"; type="text/markdown", </llms.txt>; rel="describedby"';
        if ($representation = unacceptable) { return 406; }
        try_files $home_file =500;
    }

    location ~ ^/(about|contact|privacy)(?:/|\.html)$ {
        return 301 /$1$is_args$args;
    }
    location ~ ^/(about|contact|privacy)$ {
        try_files $uri.html =404;
    }

    location = /_errors/markdown {
        internal;
        alias /usr/share/nginx/html/404.md;
        types { }
        default_type text/markdown;
        add_header Vary Accept always;
    }
    location = /_errors/html {
        internal;
        add_header Vary Accept always;
        return 404;
    }
    location = /404.md { return 404; }

    location /assets/ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
